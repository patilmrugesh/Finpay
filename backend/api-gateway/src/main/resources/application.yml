server:
  port: 8083

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**
              filters:
                - AddRequestHeader=X-Internal-Gateway-Token, finpay-internal-secret-key-2026

            - id: wallet-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/wallet/**
              filters:
                - AddRequestHeader=X-Internal-Gateway-Token, finpay-internal-secret-key-2026