server:
  port: 8083

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/auth/**

            - id: wallet-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/wallet/**